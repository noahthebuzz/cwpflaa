version: "3.9"

services:
  db:
    restart: unless-stopped
    ports: []

  backend:
    restart: unless-stopped
    ports: []
    volumes: []
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  frontend:
    restart: unless-stopped
    ports: []

  nginx:
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  certbot_certs:
  certbot_www:
